<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ILJI AX</title>
<!-- GitHub Pages 입구(piet666/ilji_ax). 터널.py 가 https://cathedral-wood-nextel-gourmet.trycloudflare.com 을 채우고 url.txt 와 같이 올린다.
     터널이 살았는지(/ping) 보고 넘어가고, 아니면 5초마다 다시 본다. 색은 ax.css 와 같은 값 -->
<style>
  :root { --page: #1f3a2e; --on-page: #e6ede8; --on-page-2: #a9bdb0; --accent: #f7a501; --crit: #cd4239;
    --sans: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", "Malgun Gothic", sans-serif;
    --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: var(--page); color: var(--on-page); font: 15px/1.6 var(--sans); }
  main { max-width: 340px; opacity: 0; transition: opacity .3s; }
  main.show { opacity: 1; }
  .brand { font: 600 12px/1 var(--mono); letter-spacing: .18em; color: var(--on-page-2); margin: 0 0 28px; }
  h1 { display: flex; align-items: center; gap: 12px; margin: 0 0 8px; font-size: 19px; font-weight: 600; }
  /* 설비 상태등처럼: 연결 중엔 호박색이 숨 쉬고, 오래 안 되면 빨강 */
  .lamp { flex: none; width: 12px; height: 12px; border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 0 4px rgba(247,165,1,.18); animation: breathe 1.6s ease-in-out infinite; }
  .late .lamp { background: var(--crit); box-shadow: 0 0 0 4px rgba(205,66,57,.22); }
  @keyframes breathe { 50% { opacity: .35; } }
  p { margin: 0; color: var(--on-page-2); }
  .meta { margin-top: 24px; font: 12px var(--mono); color: var(--on-page-2); opacity: .8; }
  a { color: var(--accent); }
  @media (prefers-reduced-motion: reduce) { .lamp { animation: none; } main { transition: none; } }
</style>
</head>
<body>
<main id="m">
  <p class="brand">ILJI AX</p>
  <h1><span class="lamp" aria-hidden="true"></span><span id="t">서버에 연결하는 중</span></h1>
  <p id="s" role="status">노트북이 막 켜졌다면 1~2분 걸립니다. 연결되면 바로 넘어갑니다.</p>
  <p class="meta" id="n"></p>
  <noscript><p><a href="https://cathedral-wood-nextel-gourmet.trycloudflare.com">ILJI AX 로 이동</a></p></noscript>
</main>
<script>
  const LATE_MS = 3 * 60 * 1000, t0 = Date.now();
  let tries = 0;
  // 화면이 바로 넘어가면 깜빡이지 않게 조금 뒤에 보인다
  setTimeout(() => document.getElementById("m").classList.add("show"), 600);

  async function newestUrl() {
    // index.html 은 브라우저가 10분까지 옛것을 쓴다 → 주소는 매번 url.txt 를 새로 받는다
    try {
      const r = await fetch("url.txt?t=" + Date.now(), {cache: "no-store"});
      if (r.ok) return (await r.text()).trim();
    } catch (e) {}
    return "https://cathedral-wood-nextel-gourmet.trycloudflare.com";
  }

  async function check() {
    tries++;
    const url = await newestUrl();
    try {
      const r = await fetch(url + "/ping", {cache: "no-store", signal: AbortSignal.timeout(8000)});
      if (r.ok) { location.replace(url); return; }
    } catch (e) {}  // 옛 주소(1033)·서버 꺼짐 모두 여기로
    const s = Math.round((Date.now() - t0) / 1000);
    if (Date.now() - t0 > LATE_MS) {
      document.body.classList.add("late");
      document.getElementById("t").textContent = "서버에 연결하지 못했습니다";
      document.getElementById("s").textContent = "서버 노트북이 켜져 있고 인터넷에 연결돼 있는지 확인해 주세요. 계속 다시 시도합니다.";
    }
    document.getElementById("n").textContent = `${tries}번 시도 · ${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
    setTimeout(check, 5000);
  }
  check();
</script>
</body>
</html>
